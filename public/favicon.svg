<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)" />
  
  <!-- Left Piggy 🐷 (Offset slightly left) -->
  <g transform="translate(4, 10) scale(1.15)">
    <!-- Ears -->
    <path d="M4.5 9C3.5 5.5 5 2.8 7.5 3.5C9.5 4.2 9 7.2 8 9" fill="#F472B6" stroke="#DB2777" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M19.5 9C20.5 5.5 19 2.8 16.5 3.5C14.5 4.2 15 7.2 16 9" fill="#F472B6" stroke="#DB2777" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Head Base -->
    <ellipse cx="12" cy="13.5" rx="8.5" ry="7.5" fill="#FCE7F3" stroke="#F43F5E" stroke-width="1.2"/>
    <!-- Eyes -->
    <circle cx="8.5" cy="12" r="1.3" fill="#1E293B"/>
    <circle cx="9" cy="11.5" r="0.45" fill="#FFFFFF"/>
    <circle cx="15.5" cy="12" r="1.3" fill="#1E293B"/>
    <circle cx="16" cy="11.5" r="0.45" fill="#FFFFFF"/>
    <!-- Cheeks -->
    <ellipse cx="6" cy="14.2" rx="1.3" ry="0.8" fill="#F472B6" opacity="0.6"/>
    <ellipse cx="18" cy="14.2" rx="1.3" ry="0.8" fill="#F472B6" opacity="0.6"/>
    <!-- Snout -->
    <ellipse cx="12" cy="15" rx="3.8" ry="2.6" fill="#FB7185" stroke="#E11D48" stroke-width="1.1"/>
    <ellipse cx="10.8" cy="15" rx="0.65" ry="1.1" fill="#881337"/>
    <ellipse cx="13.2" cy="15" rx="0.65" ry="1.1" fill="#881337"/>
  </g>

  <!-- Right Siamese Cat 🐱 (Offset slightly right & over) -->
  <g transform="translate(32, 10) scale(1.15)">
    <!-- Ears -->
    <path d="M4.2 9.8L6.8 2.5C7.1 1.8 8.1 1.8 8.4 2.5L10.5 8.2" fill="#3A2318" stroke="#261710" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M19.8 9.8L17.2 2.5C16.9 1.8 15.9 1.8 15.6 2.5L13.5 8.2" fill="#3A2318" stroke="#261710" stroke-width="0.8" stroke-linejoin="round"/>
    <!-- Head Base -->
    <ellipse cx="12" cy="14" rx="8" ry="7.5" fill="#FAF4EE" stroke="#E2D4C3" stroke-width="1"/>
    <!-- Mask -->
    <path d="M8 12.5C8 9.8 9.6 8 12 8C14.4 8 16 9.8 16 12.5C16 16.5 14.8 19 12 19C9.2 19 8 16.5 8 12.5Z" fill="#3A2318"/>
    <!-- Eyes -->
    <ellipse cx="9" cy="12.2" rx="1.8" ry="1.4" fill="#0284C7"/>
    <circle cx="9.2" cy="12.2" r="0.9" fill="#0F172A"/>
    <circle cx="9.6" cy="11.7" r="0.4" fill="#FFFFFF"/>
    <ellipse cx="15" cy="12.2" rx="1.8" ry="1.4" fill="#0284C7"/>
    <circle cx="14.8" cy="12.2" r="0.9" fill="#0F172A"/>
    <circle cx="15.2" cy="11.7" r="0.4" fill="#FFFFFF"/>
